name: Sync from Notion

# Anyone may run this: it only ever opens a pull request. Publishing is the merge,
# and that is gated by branch protection on main.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the job on a missing Slug, a duplicate Slug, an unsupported block or
      # a video uploaded to Notion, naming the offending Notion page in the log.
      - run: npm run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}

      # Building here means a schema violation is caught in the PR, not on main.
      - run: npm run build

      - uses: peter-evans/create-pull-request@v7
        with:
          # A PR opened with the default GITHUB_TOKEN does not trigger other
          # workflows. Cloudflare Pages' and Vercel's native git integrations are
          # not Actions, so previews still build; a preview implemented AS an
          # Action would need a PAT or GitHub App token here instead.
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: notion-sync
          title: "Sync from Notion"
          commit-message: "content: sync from Notion"
          body: |
            Generated by `npm run sync`. Review the diff, check the preview
            deployment, then merge to publish.
          add-paths: |
            src/content/works
            src/assets/notion
            public/_redirects
            content.lock.json
